<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuestro plan 💙</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="plan">
  <a href="index.html#ruleta" class="btn btn-suave">← Volver a la ruleta</a>
  <p id="p-emoji" class="emoji-grande" aria-hidden="true"></p>
  <p class="eyebrow">Plan elegido por la ruleta</p>
  <h1 id="p-titulo"></h1>
  <p id="p-detalle" class="frase"></p>
  <p class="final">¡Kiara, tenemos una cita! 💙💗</p>
  <a href="index.html#ruleta" class="btn">Girar otra vez</a>
</main>
<div id="corazones" aria-hidden="true"></div>
<script src="config.js"></script>
<script>
(function(){
  var i = parseInt(new URLSearchParams(location.search).get("p"), 10);
  var r = CONFIG.ruleta[i];
  if(!r){ r = { emoji:"💙", titulo:"Aún no hay plan", detalle:"Vuelve a la ruleta y gira para elegir uno." }; }
  document.getElementById("p-emoji").textContent = r.emoji;
  document.getElementById("p-titulo").textContent = r.titulo;
  document.getElementById("p-detalle").textContent = r.detalle;
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    for(var k=0;k<20;k++){var s=document.createElement("span");s.textContent=k%2?"💙":"💗";
      s.style.left=Math.random()*95+"vw";s.style.animationDelay=Math.random()*1.5+"s";
      document.getElementById("corazones").appendChild(s);}
  }
})();
</script>
</body>
</html>
